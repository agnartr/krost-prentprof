<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kröst – prentpróf / print test</title>
<!--
  Prentpróf fyrir Kröst: prentar beint á Star Micronics mPOP (USB) úr Chrome á Android
  með WebUSB og einföldum Star-skipunum (StarPRNT). Engin önnur forrit eða söfn þarf.
  Síðan verður að vera opnuð yfir HTTPS (WebUSB krefst þess). Engin gögn fara frá tækinu.
  Tungumál: ?lang=en eða ?lang=is; annars eftir tungumáli vafrans.
-->
<style>
  :root { --bg:#f6f5f2; --ink:#1b1b1b; --muted:#666; --line:#d9d6cf; --ok:#1f7a3a; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font: 18px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width: 860px; margin: 0 auto; padding: 20px 20px 48px; }
  h1 { font-size: 28px; margin: 8px 0 4px; }
  h2 { font-size: 20px; margin: 28px 0 10px; }
  p { margin: 6px 0 12px; }
  .muted { color: var(--muted); }
  .lang { text-align: right; font-size: 16px; }
  .lang a { color: var(--ink); margin-left: 12px; }
  .lang a.on { font-weight: 700; text-decoration: none; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  button { font: inherit; padding: 16px 14px; border-radius: 10px; border: 1px solid var(--line); background:#fff; color:var(--ink); text-align:left; cursor:pointer; min-height: 72px; }
  button strong { display:block; font-size: 18px; }
  button span { display:block; font-size: 15px; color: var(--muted); }
  button.primary { background: var(--ink); color:#fff; border-color: var(--ink); }
  button.primary span { color:#ddd; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #status, .notice { padding: 12px 14px; border-radius: 10px; background:#fff; border:1px solid var(--line); margin: 12px 0; }
  #status.ok { border-color: var(--ok); color: var(--ok); }
  #status.err, .notice.err { border-color: var(--err); color: var(--err); }
  ol { padding-left: 22px; } li { margin: 6px 0; }
  #log { background:#111; color:#e8e8e8; font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 12px; border-radius: 10px; min-height: 140px; white-space: pre-wrap; overflow-wrap:anywhere; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  label { font-size: 16px; }
  select { font: inherit; padding: 8px; border-radius: 8px; border:1px solid var(--line); background:#fff; }
  .btn-link { display:inline-block; padding: 12px 16px; border-radius: 10px; background: var(--ink); color:#fff; text-decoration:none; font-weight:600; }
  .notice { font-size: 18px; }
</style>
</head>
<body>
<main>
  <div class="lang"><a href="?lang=is" id="lnkIs">Íslenska</a><a href="?lang=en" id="lnkEn">English</a></div>
  <div id="support"></div>
  <h1 data-t="title"></h1>
  <p class="muted" data-t="intro"></p>

  <h2 data-t="beforeH"></h2>
  <ol>
    <li data-t="before1"></li>
    <li data-t="before2"></li>
    <li data-t="before3"></li>
    <li data-t="before4"></li>
  </ol>

  <h2 data-t="connectH"></h2>
  <ol>
    <li data-t="connect1"></li>
    <li data-t="connect2"></li>
    <li data-t="connect3"></li>
  </ol>
  <div class="grid">
    <button class="primary" id="btnConnect"><strong data-t="bConnect"></strong><span data-t="bConnectS"></span></button>
    <button id="btnConnectAny"><strong data-t="bAny"></strong><span data-t="bAnyS"></span></button>
  </div>
  <div id="status"></div>

  <h2 data-t="testH"></h2>
  <p data-t="testP"></p>
  <div class="grid">
    <button id="btnText" disabled><strong data-t="bText"></strong><span data-t="bTextS"></span></button>
    <button id="btnReceipt" disabled><strong data-t="bReceipt"></strong><span data-t="bReceiptS"></span></button>
    <button id="btnTicket" disabled><strong data-t="bTicket"></strong><span data-t="bTicketS"></span></button>
    <button id="btnDrawer" disabled><strong data-t="bDrawer"></strong><span data-t="bDrawerS"></span></button>
    <button id="btnCut" disabled><strong data-t="bCut"></strong><span data-t="bCutS"></span></button>
  </div>
  <p style="margin-top:16px" data-t="checkP"></p>
  <ol>
    <li data-t="check1"></li>
    <li data-t="check2"></li>
    <li data-t="check3"></li>
  </ol>
  <div class="row" style="margin-bottom:12px">
    <label for="cp" data-t="cpLabel"></label>
    <select id="cp">
      <option value="32" selected data-t="cpA"></option>
      <option value="none" data-t="cpB"></option>
    </select>
  </div>

  <h2 data-t="afterH"></h2>
  <ol>
    <li data-t="after1"></li>
    <li data-t="after2"></li>
    <li data-t="after3"></li>
    <li data-t="after4"></li>
  </ol>
  <div class="grid">
    <button id="btnDisconnect" disabled><strong data-t="bDisc"></strong><span data-t="bDiscS"></span></button>
  </div>

  <h2 data-t="helpH"></h2>
  <ul>
    <li data-t="help1"></li>
    <li data-t="help2"></li>
    <li data-t="help3"></li>
  </ul>

  <h2 data-t="logH"></h2>
  <div id="log"></div>
</main>

<script>
(() => {
  // --- Texti á íslensku og ensku ---
  const T = {
    is: {
      title: 'Prentpróf fyrir Kröst',
      intro: 'Á þessari síðu er prófað hvort spjaldtölvan getur prentað kvittanir og eldhúsmiða og opnað peningaskúffuna án Dineout. Prófið tekur um tíu mínútur. Ekkert er selt og ekkert vistað.',
      beforeH: 'Áður en byrjað er',
      before1: 'Gerðu prófið þegar staðurinn er lokaður. Kassinn getur ekki prentað á meðan.',
      before2: 'Notaðu spjaldtölvuna við kassann, ekki símann þinn.',
      before3: 'Lokaðu Dineout alveg: opnaðu Settings → Apps → Dineout og ýttu á Force stop.',
      before4: 'Gakktu úr skugga um að kveikt sé á prentaranum og að USB-snúran úr honum sé tengd spjaldtölvunni.',
      connectH: 'Skref 1: Tengjast prentaranum',
      connect1: 'Ýttu á „Tengjast prentaranum“. Listi birtist. Veldu Star-prentarann (hann gæti heitið mPOP eða Star) og ýttu á Connect.',
      connect2: 'Ef spjaldtölvan spyr hvort Chrome megi nota tækið skaltu ýta á OK eða Allow. Ekki haka við að Chrome eigi alltaf að opnast.',
      connect3: 'Þegar reiturinn fyrir neðan hnappana verður grænn og segir „Tengt“ ferðu í skref 2.',
      bConnect: 'Tengjast prentaranum', bConnectS: 'Sýnir lista yfir prentara',
      bAny: 'Sýna öll USB-tæki', bAnyS: 'Aðeins ef prentarinn er ekki á fyrri listanum',
      testH: 'Skref 2: Prenta prófin',
      testP: 'Ýttu einu sinni á hvern hnapp og bíddu þar til miðinn kemur út. Taktu mynd af hverjum miða.',
      bText: 'Prufutexti', bTextS: 'Íslenskir stafir og stórt letur',
      bReceipt: 'Prufukvittun', bReceiptS: 'Sýnishorn af kvittun, engin sala',
      bTicket: 'Prufueldhúsmiði', bTicketS: 'Sýnishorn af eldhúsmiða, engin pöntun',
      bDrawer: 'Opna peningaskúffu', bDrawerS: 'Skúffan á að opnast. Lokaðu henni aftur.',
      bCut: 'Skera blað', bCutS: 'Fæðir smá blað og sker',
      checkP: 'Athugaðu þetta:',
      check1: 'Eru íslensku stafirnir (á, ð, þ, æ, ö) réttir á prufutextanum? Ef ekki skaltu breyta „Stafastillingu“ hér fyrir neðan í B og prenta prufutextann aftur.',
      check2: 'Opnaðist peningaskúffan?',
      check3: 'Var blaðið skorið eftir hvern miða?',
      cpLabel: 'Stafastilling:', cpA: 'A (prófa fyrst)', cpB: 'B (aðeins ef stafirnir eru rangir)',
      afterH: 'Skref 3: Þegar prófinu er lokið',
      after1: 'Taktu skjámynd af skránni neðst á síðunni (ýttu á rofann og hljóð niður samtímis).',
      after2: 'Ýttu á „Aftengja“ hér fyrir neðan og lokaðu Chrome.',
      after3: 'Opnaðu Dineout og prentaðu kvittun eða miða eins og venjulega, til að athuga að Dineout geti enn prentað.',
      after4: 'Sendu skjámyndina og myndirnar af miðunum þeim sem sendi þér þessa slóð.',
      bDisc: 'Aftengja', bDiscS: 'Sleppir prentaranum svo Dineout geti notað hann',
      helpH: 'Ef eitthvað fer úrskeiðis',
      help1: 'Listinn er tómur eða tengingin mistekst: athugaðu að Dineout hafi verið stöðvað (Force stop). Taktu svo USB-snúru prentarans úr spjaldtölvunni, settu hana aftur í og reyndu aftur. Ef spjaldtölvan spyr hvaða forrit eigi að opnast skaltu ýta á Cancel.',
      help2: 'Ekkert prentast þó að það standi „Tengt“: taktu skjámynd af skránni og hættu prófinu.',
      help3: 'Dineout getur ekki prentað eftir prófið: taktu USB-snúruna úr og settu hana aftur í. Ef spjaldtölvan spyr hvaða forrit eigi að nota skaltu velja Dineout. Ef það dugar ekki skaltu endurræsa spjaldtölvuna.',
      logH: 'Skrá (fyrir skjámyndina)',
      notConnected: 'Ekki tengt.',
      connected: n => `Tengt: ${n}. Farðu í skref 2.`,
      connectFail: busy => busy ? 'Tengingin mistókst. Líklega er Dineout enn í gangi. Stöðvaðu það með Force stop og reyndu aftur.' : 'Tengingin mistókst. Sjá „Ef eitthvað fer úrskeiðis“ neðst á síðunni.',
      cancelled: 'Enginn prentari var valinn. Ýttu aftur á „Tengjast prentaranum“.',
      sendFail: 'Prentun mistókst. Taktu skjámynd af skránni neðst á síðunni.',
      unplugged: 'Prentarinn aftengdist.',
      noHttps: 'Síðan er ekki opnuð á öruggri slóð (https). Opnaðu slóðina sem þú fékkst senda.',
      noUsb: 'Þessi vafri getur ekki tengst prentaranum. Síðan þarf að vera opin í Chrome, ekki Samsung Internet.',
      openChrome: 'Opna í Chrome',
    },
    en: {
      title: 'Kröst print test',
      intro: 'This page checks whether the tablet can print receipts and kitchen tickets and open the cash drawer without the Dineout app. It takes about ten minutes. Nothing is sold and nothing is saved.',
      beforeH: 'Before you start',
      before1: 'Do the test when the restaurant is closed. The till cannot print while the test is running.',
      before2: 'Use the till tablet, not your phone.',
      before3: 'Close Dineout completely: open Settings → Apps → Dineout and tap Force stop.',
      before4: 'Check that the printer is switched on and that its USB cable is plugged into the tablet.',
      connectH: 'Step 1: Connect to the printer',
      connect1: 'Tap “Connect to the printer”. A list appears. Choose the Star printer (it may be called mPOP or Star) and tap Connect.',
      connect2: 'If the tablet asks whether Chrome may use the device, tap OK or Allow. Do not tick the box that makes Chrome always open.',
      connect3: 'When the box under the buttons turns green and says “Connected”, go to step 2.',
      bConnect: 'Connect to the printer', bConnectS: 'Shows a list of printers',
      bAny: 'Show all USB devices', bAnyS: 'Only if the printer is not in the first list',
      testH: 'Step 2: Print the tests',
      testP: 'Tap each button once and wait until the paper comes out. Take a photo of each printout.',
      bText: 'Test text', bTextS: 'Icelandic letters and large text',
      bReceipt: 'Test receipt', bReceiptS: 'A sample receipt, not a real sale',
      bTicket: 'Test kitchen ticket', bTicketS: 'A sample kitchen ticket, not a real order',
      bDrawer: 'Open cash drawer', bDrawerS: 'The drawer should open. Close it again.',
      bCut: 'Cut paper', bCutS: 'Feeds a little paper and cuts it',
      checkP: 'Check the following:',
      check1: 'Are the Icelandic letters (á, ð, þ, æ, ö) correct on the test text? If not, change “Letter setting” below to B and print the test text again.',
      check2: 'Did the cash drawer open?',
      check3: 'Was the paper cut after each printout?',
      cpLabel: 'Letter setting:', cpA: 'A (try first)', cpB: 'B (only if the letters are wrong)',
      afterH: 'Step 3: When you are finished',
      after1: 'Take a screenshot of the log at the bottom of this page (press the power button and volume down at the same time).',
      after2: 'Tap “Disconnect” below and close Chrome.',
      after3: 'Open Dineout and print a receipt or ticket the way you normally do, to check that Dineout can still print.',
      after4: 'Send the screenshot and the photos of the printouts to the person who sent you this link.',
      bDisc: 'Disconnect', bDiscS: 'Releases the printer so Dineout can use it',
      helpH: 'If something goes wrong',
      help1: 'The list is empty or connecting fails: check that Dineout has been force-stopped. Then unplug the printer’s USB cable from the tablet, plug it back in and try again. If the tablet asks which app to open, tap Cancel.',
      help2: 'Nothing prints although it says “Connected”: take a screenshot of the log and stop the test.',
      help3: 'Dineout cannot print after the test: unplug the USB cable and plug it back in. If the tablet asks which app to use, choose Dineout. If that does not help, restart the tablet.',
      logH: 'Log (for the screenshot)',
      notConnected: 'Not connected.',
      connected: n => `Connected: ${n}. Go to step 2.`,
      connectFail: busy => busy ? 'Could not connect. Dineout is probably still running. Force-stop it and try again.' : 'Could not connect. See “If something goes wrong” at the bottom of the page.',
      cancelled: 'No printer was chosen. Tap “Connect to the printer” again.',
      sendFail: 'Printing failed. Take a screenshot of the log at the bottom of the page.',
      unplugged: 'The printer was disconnected.',
      noHttps: 'This page is not open on a secure (https) address. Open the link you were sent.',
      noUsb: 'This browser cannot connect to the printer. The page must be open in Chrome, not Samsung Internet.',
      openChrome: 'Open in Chrome',
    },
  };
  const qs = new URLSearchParams(location.search).get('lang');
  const lang = (qs === 'en' || qs === 'is') ? qs : (navigator.language || '').toLowerCase().startsWith('is') ? 'is' : 'en';
  const L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = L[el.dataset.t]; });
  document.getElementById(lang === 'en' ? 'lnkEn' : 'lnkIs').classList.add('on');

  const STAR_VENDOR_ID = 0x0519;
  const COLS = 32; // mPOP: 58 mm pappír, um 32 stafir í línu
  let device = null, epOut = null, ifaceNo = null;

  const $ = id => document.getElementById(id);
  const logEl = $('log');
  const log = (msg) => { const d = new Date(); const t = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`; logEl.textContent += `[${t}] ${msg}\n`; logEl.scrollTop = logEl.scrollHeight; };
  const setStatus = (msg, cls) => { const s = $('status'); s.textContent = msg; s.className = cls || ''; };
  const testButtons = ['btnText','btnReceipt','btnTicket','btnDrawer','btnCut','btnDisconnect'];
  const enableTests = on => testButtons.forEach(id => $(id).disabled = !on);
  setStatus(L.notConnected);

  // --- Stuðningur vafrans ---
  const sup = $('support');
  if (!window.isSecureContext) sup.innerHTML = `<div class="notice err">${L.noHttps}</div>`;
  else if (!('usb' in navigator) || /SamsungBrowser/i.test(navigator.userAgent)) {
    const chromeIntent = `intent://${location.host}${location.pathname}${location.search}#Intent;scheme=https;package=com.android.chrome;end`;
    sup.innerHTML = `<div class="notice err">${L.noUsb}<div style="margin-top:10px"><a class="btn-link" href="${chromeIntent}">${L.openChrome}</a></div></div>`;
  }
  log(`UA: ${navigator.userAgent}`);
  log(`secure=${window.isSecureContext} webusb=${'usb' in navigator} lang=${lang}`);

  // --- Star-skipanir (StarPRNT / Star Line Mode) ---
  const ESC = 0x1B, GS = 0x1D;
  const CMD = {
    init:      [ESC, 0x40],
    codepage:  n => [ESC, GS, 0x74, n],
    align:     n => [ESC, GS, 0x61, n],      // 0 vinstri, 1 miðja, 2 hægri
    boldOn:    [ESC, 0x45],
    boldOff:   [ESC, 0x46],
    size:      (h, w) => [ESC, 0x69, h, w],  // 0 = venjulegt, 1 = tvöfalt
    lf:        [0x0A],
    cut:       [ESC, 0x64, 0x03],            // fæða og skera að hluta
    drawer:    [0x07],                       // opna skúffu 1
  };

  // Kóðun í Windows-1252. Íslensku stafirnir eru allir á bilinu 0xA0–0xFF.
  const CP1252_EXTRA = { '€':0x80, '‚':0x82, '„':0x84, '…':0x85, '‘':0x91, '’':0x92, '“':0x93, '”':0x94, '•':0x95, '–':0x96, '—':0x97 };
  const enc = (str) => {
    const out = [];
    for (const ch of str) {
      const c = ch.codePointAt(0);
      if (c < 0x80 || (c >= 0xA0 && c <= 0xFF)) out.push(c);
      else if (CP1252_EXTRA[ch] !== undefined) out.push(CP1252_EXTRA[ch]);
      else out.push(0x3F);
    }
    return out;
  };

  const kr = n => n.toLocaleString('de-DE') + ' kr';
  const pairLine = (left, right, cols = COLS) => left + ' '.repeat(Math.max(1, cols - left.length - right.length)) + right;
  const rule = (cols = COLS) => '-'.repeat(cols);
  const pad2 = n => String(n).padStart(2, '0');
  const stamp = (d = new Date()) => `${d.getDate()}.${d.getMonth() + 1}.${d.getFullYear()} kl. ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

  class Doc {
    constructor() { this.b = [...CMD.init]; const cp = $('cp').value; if (cp !== 'none') this.b.push(...CMD.codepage(Number(cp))); }
    raw(a) { this.b.push(...a); return this; }
    text(s) { this.b.push(...enc(s)); return this; }
    line(s = '') { return this.text(s).raw(CMD.lf); }
    bytes() { return new Uint8Array(this.b); }
  }

  // --- Tenging ---
  async function connect(filters) {
    try {
      device = await navigator.usb.requestDevice({ filters });
      log(`device: ${device.manufacturerName || '?'} ${device.productName || '?'} (VID 0x${device.vendorId.toString(16)}, PID 0x${device.productId.toString(16)})`);
      await device.open();
      if (device.configuration === null) await device.selectConfiguration(1);
      for (const iface of device.configuration.interfaces) {
        for (const alt of iface.alternates) {
          const ep = alt.endpoints.find(e => e.direction === 'out' && e.type === 'bulk');
          if (ep) { ifaceNo = iface.interfaceNumber; epOut = ep.endpointNumber; log(`interface ${ifaceNo}, class 0x${alt.interfaceClass.toString(16)}, endpoint out ${epOut}`); break; }
        }
        if (epOut !== null) break;
      }
      if (epOut === null) throw new Error('no bulk OUT endpoint');
      await device.claimInterface(ifaceNo);
      setStatus(L.connected(device.productName || 'USB'), 'ok');
      enableTests(true);
    } catch (e) {
      const busy = /claim|busy|access|in use/i.test(e.message);
      const cancelled = e.name === 'NotFoundError';
      setStatus(cancelled ? L.cancelled : L.connectFail(busy), 'err');
      log(`ERROR connect: ${e.name}: ${e.message}`);
      device = null; epOut = null; ifaceNo = null;
    }
  }

  async function send(bytes, label) {
    if (!device) { setStatus(L.notConnected, 'err'); return; }
    try {
      const r = await device.transferOut(epOut, bytes);
      log(`${label}: ${r.bytesWritten} bytes (${r.status})`);
    } catch (e) {
      log(`ERROR ${label}: ${e.name}: ${e.message}`);
      setStatus(L.sendFail, 'err');
    }
  }

  // --- Prófin (prentaður texti er á íslensku, því íslensku stafirnir eru það sem er prófað) ---
  function testText() {
    const d = new Doc();
    d.raw(CMD.align(1)).raw(CMD.boldOn).raw(CMD.size(1,1)).line('KRÖST').raw(CMD.size(0,0)).raw(CMD.boldOff).line('Prentpróf / print test');
    d.raw(CMD.align(0)).line(rule());
    d.line('Íslenskir stafir:');
    d.line('áéíóúýþæðö');
    d.line('ÁÉÍÓÚÝÞÆÐÖ');
    d.line('Grillaður þorskhnakki');
    d.line('Steik og rauðvínsglas – 6.990 kr');
    d.line(rule());
    d.raw(CMD.boldOn).line('Feitletrað / bold').raw(CMD.boldOff);
    d.raw(CMD.size(1,0)).line('Tvöföld hæð / tall').raw(CMD.size(0,0));
    d.raw(CMD.size(1,1)).line('Tvöfalt / big').raw(CMD.size(0,0));
    d.raw(CMD.align(2)).line('Hægri / right').raw(CMD.align(0));
    d.line(`Code page: ${$('cp').value}`);
    d.line(''); d.line(''); d.raw(CMD.cut);
    return send(d.bytes(), 'text');
  }

  function testReceipt() {
    const items = [['Arancini', 2890], ['Pork Belly', 2890], ['Smoked Salmon', 3490]];
    const total = items.reduce((a, [, p]) => a + p, 0);
    const vat = Math.round(total * 11 / 111);
    const d = new Doc();
    d.raw(CMD.align(1)).raw(CMD.boldOn).raw(CMD.size(1,1)).line('KRÖST').raw(CMD.size(0,0)).raw(CMD.boldOff);
    d.line('Hlemmur Mathöll, Laugavegi 107');
    d.raw(CMD.align(0)).line(rule());
    d.line(pairLine('Reikningur nr.', 'PRÓF-0001'));
    d.line(pairLine('Dags.', stamp()));
    d.line(pairLine('Borð', 'Bíper 10'));
    d.line(rule());
    for (const [name, price] of items) d.line(pairLine(`1x ${name}`, kr(price)));
    d.line(rule());
    d.raw(CMD.boldOn).raw(CMD.size(1,0)).line(pairLine('SAMTALS', kr(total))).raw(CMD.size(0,0)).raw(CMD.boldOff);
    d.line(pairLine(`Matur 11% af ${kr(total)}`, kr(vat)));
    d.line(pairLine('Greitt með posa', kr(total)));
    d.line(rule());
    d.raw(CMD.align(1)).line('Reikningur þessi á uppruna sinn').line('í rafrænu bókhaldskerfi').line('skv. reglugerð nr. 505/2013.');
    d.raw(CMD.boldOn).line('PRUFA / TEST').raw(CMD.boldOff).line('EKKI GILDUR REIKNINGUR').line('NOT A VALID RECEIPT');
    d.line(''); d.line(''); d.raw(CMD.cut);
    return send(d.bytes(), 'receipt');
  }

  function testTicket() {
    const d = new Doc();
    d.raw(CMD.align(1)).raw(CMD.boldOn).raw(CMD.size(1,1)).line('PRUFA / TEST').line('EKKI ELDA').line('DO NOT COOK').raw(CMD.size(0,0)).raw(CMD.boldOff).line(rule());
    d.raw(CMD.size(1,1)).line('Borðað á staðnum').raw(CMD.size(0,0));
    d.raw(CMD.align(0)).line('Borð');
    d.raw(CMD.boldOn).raw(CMD.size(1,1)).line('Bíper 2').raw(CMD.size(0,0)).raw(CMD.boldOff);
    d.line(stamp());
    d.line('');
    d.raw(CMD.size(1,1)).line('1x Steik').raw(CMD.size(0,0)).line('   medium');
    d.raw(CMD.size(1,1)).line('1x Kjúklinga-').line('   salat').raw(CMD.size(0,0)).line('   auka kjúklingur');
    d.raw(CMD.size(1,1)).line('1x Krösti börger').raw(CMD.size(0,0)).line('   ATH: án lauks');
    d.line('');
    d.raw(CMD.align(1)).raw(CMD.size(1,1)).line('Bíper 2').line('PRUFA / TEST').raw(CMD.size(0,0));
    d.line(''); d.line(''); d.raw(CMD.cut);
    return send(d.bytes(), 'kitchen ticket');
  }

  $('btnConnect').onclick = () => connect([{ vendorId: STAR_VENDOR_ID }]);
  $('btnConnectAny').onclick = () => connect([]);
  $('btnText').onclick = testText;
  $('btnReceipt').onclick = testReceipt;
  $('btnTicket').onclick = testTicket;
  $('btnDrawer').onclick = () => send(new Uint8Array([...CMD.init, ...CMD.drawer]), 'drawer');
  $('btnCut').onclick = () => send(new Uint8Array([...CMD.lf, ...CMD.lf, ...CMD.cut]), 'cut');
  $('btnDisconnect').onclick = async () => {
    try { if (device) { await device.releaseInterface(ifaceNo); await device.close(); } } catch (e) { log(`disconnect: ${e.message}`); }
    device = null; epOut = null; ifaceNo = null; enableTests(false); setStatus(L.notConnected); log('disconnected');
  };
  if (navigator.usb) navigator.usb.addEventListener('disconnect', e => { if (device && e.device === device) { device = null; enableTests(false); setStatus(L.unplugged, 'err'); log('device unplugged'); } });
})();
</script>
</body>
</html>
